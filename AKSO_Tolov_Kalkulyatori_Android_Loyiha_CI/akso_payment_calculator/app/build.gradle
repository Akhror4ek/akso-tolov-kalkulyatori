plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'uz.akso.kalkulyator'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.akso.kalkulyator'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'

    // Firebase services.
    implementation platform('com.google.firebase:firebase-bom:34.14.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Google account sign-in with Android Credential Manager.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

    // WorkManager's Worker exposes Guava ListenableFuture in its Java API.
    // Use the Android Guava artifact (not the empty listenablefuture compatibility stub).
    implementation 'com.google.guava:guava:33.7.2-android'
}
