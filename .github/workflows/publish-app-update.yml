name: Publish AKSO Finance Update

on:
  create:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Sotuvchilarga ko'rinadigan yangilanishlar ro'yxati"
        required: false
        type: string
        default: "AKSO Finance ilovasi yangilandi."

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Must use the same cached debug signing key as build-apk.yml so
      # Android accepts each release as an update to the installed app.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: akso-debug-signing-key-v2

      - name: Build release APK
        working-directory: AKSO_Tolov_Kalkulyatori_Android_Loyiha_CI/akso_payment_calculator
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to GitHub Releases
        working-directory: AKSO_Tolov_Kalkulyatori_Android_Loyiha_CI/akso_payment_calculator
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p" app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)

          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "versionCode yoki versionName app/build.gradle faylidan olinmadi."
            exit 1
          fi

          TAG_NAME="v${VERSION_CODE}"
          RELEASE_TITLE="AKSO Finance ${VERSION_NAME}"
          NOTES="$RELEASE_NOTES_INPUT"
          if [[ -z "$NOTES" ]]; then
            NOTES="AKSO Finance ${VERSION_NAME} yangilanishi."
          fi

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Yig'ilgan APK topilmadi: $APK_PATH"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH#AKSO-Finance.apk" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG_NAME" "$APK_PATH#AKSO-Finance.apk" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "$GITHUB_SHA"
          fi

          echo "Published $RELEASE_TITLE as $TAG_NAME"
